---
- name: Common Public Playbook
  hosts: all
  gather_facts: true

  tasks:
    - name: Debug useful variable readouts
      debug:
        msg: "
          \n=== System Information ===\n\n
          Logged in as: {{ ansible_env.USER }}
          \n\nHome directory: {{ ansible_user_dir }}
          \n\nEnvironment HOME: {{ ansible_env.HOME }}
          \n\nPATH:
            {{ ansible_env.PATH }}
          \n\nOS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})
          \n\nHostname: {{ ansible_hostname }}
          \n\nFQDN: {{ ansible_fqdn }}
          \n\nDefault IPv4: {{ ansible_default_ipv4.address }}
          \n\nInventory Sources: {{ ansible_inventory_sources }}
          \n\nPackage Manager: {{ ansible_pkg_mgr }}
          \n========================="
    - name: Include config yaml
      include_vars:
        file: "{{ ansible_env.HOME }}/repos/basecamp/config/config.yaml"
    - name: Ensure directories are created without changing existing permissions
      file:
        path: "{{ item | expanduser }}"
        state: directory
      loop: "{{ directory_structure }}"
      vars:
        directory_structure: "{{ directory_structure | default([]) }}"
    - name: Ensure destination directory exists
      file:
        path: "{{ item.dest | dirname }}"
        state: directory
        mode: '0755'
      loop: "{{ wget_downloads }}"

    - name: Download file only if changed
      get_url:
        url: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
        force: no
        timeout: 30
        backup: yes  # Create backup if file changes
      loop: "{{ wget_downloads }}"
      retries: 3
      delay: 10
      register: download_results
      until: download_results is succeeded
      ignore_errors: yes
      tags: downloads

    - name: Report any download failures
      debug:
        msg: "WARNING: Failed to download {{ item.item.src }} - {{ item.msg }}"
      loop: "{{ download_results.results }}"
      when: item.failed
      tags: downloads
    - name: Check symlink sources
      ansible.builtin.stat:
        path: "{{ item.src }}"
      register: symlink_sources
      loop: "{{ public_symlinks }}"
      no_log: true

    - name: Output missing symlink sources
      debug:
        msg: "Missing source: {{ item.item.src }}"
      loop: "{{ symlink_sources.results | selectattr('stat.exists', 'equalto', false) | list }}"

    - name: Ensure parent directories of symlink destinations exist
      ansible.builtin.file:
        path: "{{ item.dest | dirname }}"
        state: directory
        mode: '0755'
      loop: "{{ public_symlinks }}"

    - name: Make public symlinks for existing sources
      ansible.builtin.file:
        src: "{{ item.item.src }}"
        dest: "{{ item.item.dest }}"
        state: link
        force: yes
        follow: false
      loop: "{{ symlink_sources.results }}"
      when: item.stat.exists
      no_log: true
    - name: Update apt cache
      ansible.builtin.command: apt-get update --allow-releaseinfo-change
      register: apt_update
      changed_when: false
      failed_when: false
      become: true

    - name: Warn if apt update had issues
      debug:
        msg: "WARNING: apt-get update returned rc={{ apt_update.rc }}"
      when: apt_update.rc != 0

    - name: Ensure APT packages are installed
      apt:
        name: "{{ item }}"
        state: latest
      become: true
      loop: "{{ apt_packages }}"
      register: apt_install_results
      ignore_errors: true
    - name: Add desktop APT PPAs
      apt_repository:
        repo: "{{ item }}"
        state: present
        update_cache: no
      loop: "{{ apt_ppas_desktop }}"
      become: true
      when: ansible_virtualization_role != "guest"

    - name: Refresh apt cache after PPA changes
      ansible.builtin.command: apt-get update --allow-releaseinfo-change
      changed_when: false
      failed_when: false
      become: true
      when: ansible_virtualization_role != "guest"

    - name: Install desktop APT packages
      apt:
        name: "{{ item }}"
        state: latest
      become: true
      loop: "{{ apt_packages_desktop }}"
      ignore_errors: true
      when: ansible_virtualization_role != "guest"
    # onlyoffice-desktopeditors — MS-Office-fidelity suite for .docx/.xlsx
    # track-changes round-trips. Third-party apt repo, desktop machines only.
    - name: Add OnlyOffice GPG key
      ansible.builtin.get_url:
        url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
        dest: /usr/share/keyrings/onlyoffice.asc
        mode: "0644"
      become: true
      when: ansible_virtualization_role != "guest"

    - name: Add OnlyOffice apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/onlyoffice.asc] https://download.onlyoffice.com/repo/debian squeeze main"
        filename: onlyoffice
        state: present
        update_cache: yes
      become: true
      when: ansible_virtualization_role != "guest"

    - name: Install OnlyOffice desktop editors
      ansible.builtin.apt:
        name: onlyoffice-desktopeditors
        state: present
      become: true
      when: ansible_virtualization_role != "guest"
    # rasdaemon — records hardware errors (MCE, ECC memory) persistently to SQLite.
    # Query with: sudo ras-mc-ctl --summary
    - name: Install rasdaemon
      ansible.builtin.apt:
        name: rasdaemon
        state: present
      become: true

    - name: Enable and start rasdaemon service
      ansible.builtin.systemd:
        name: rasdaemon
        enabled: true
        state: started
      become: true
    # lm-sensors — reads CPU, GPU, and board temperature sensors.
    # Query with: sensors
    - name: Install lm-sensors
      ansible.builtin.apt:
        name: lm-sensors
        state: present
      become: true

    - name: Run sensors-detect in auto mode
      ansible.builtin.command:
        cmd: sensors-detect --auto
      become: true
      changed_when: false

    - name: Enable and start lm-sensors service
      ansible.builtin.systemd:
        name: lm-sensors
        enabled: true
        state: started
      become: true
    # atop — logs per-process CPU, memory, disk, and network at 10-second
    # resolution. Enables retroactive answers to "what was using CPU
    # between HH:MM and HH:MM" via: atop -r /var/log/atop/atop_YYYYMMDD -b HH:MM
    - name: Install atop
      ansible.builtin.apt:
        name: atop
        state: present
      become: true

    - name: Enable and start atop services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - atop.service       # the sampler daemon
        - atopacct.service   # per-process accounting source
        - atop-rotate.timer  # daily log rotation
      become: true
    # linux-crashdump — captures kernel state on panic for post-mortem analysis.
    # Check with: ls /var/crash/
    # Requires one reboot after install to reserve crash kernel memory.
    - name: Install linux-crashdump
      ansible.builtin.apt:
        name: linux-crashdump
        state: present
      become: true

    - name: Enable kdump-tools service
      ansible.builtin.systemd:
        name: kdump-tools
        enabled: true
        state: started
      become: true
    - name: Ensure fonts directory exists
      file:
        path: "{{ ansible_env.HOME }}/.local/share/fonts"
        state: directory
        mode: '0755'

    - name: Download and extract Nerd Fonts
      shell: |
        cd {{ ansible_env.HOME }}/.local/share/fonts
        curl -LO https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip
        unzip -o FiraCode.zip
        rm FiraCode.zip
      args:
        creates: "{{ ansible_env.HOME }}/.local/share/fonts/FiraCode-Regular.ttf"

    - name: Refresh font cache
      command: fc-cache -fv
    # fail2ban — bans IPs after repeated SSH auth failures.
    # Check with: sudo fail2ban-client status sshd
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
      become: true

    - name: Enable and start fail2ban service
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      become: true
    - name: Download yq binary
      become: true
      ansible.builtin.get_url:
        url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        dest: /usr/local/bin/yq
        mode: '0755'
        force: no

    - name: Verify yq installation
      become: true
      ansible.builtin.command: yq --version
      register: yq_version
      failed_when: "'version' not in yq_version.stdout.lower()"

    - name: Debug yq version
      ansible.builtin.debug:
        msg: "yq successfully installed: {{ yq_version.stdout }}"

    # Create a separate alias 'yqgo' for the Go version of yq so it can still be used
    # when the 'yq' command is shadowed by the Python version installed in a conda environment
    - name: Copy yq to yqgo for unambiguous use of Go version
      become: true
      ansible.builtin.copy:
        src: /usr/local/bin/yq
        dest: /usr/local/bin/yqgo
        remote_src: true
        mode: '0755'
    - name: Clone whisper.el speech-to-text package
      ansible.builtin.git:
        repo: https://github.com/natrys/whisper.el
        dest: "{{ ansible_env.HOME }}/.emacs.d/lisp/whisper"
        update: no
    - name: Install Python CLI tools via pip
      ansible.builtin.pip:
        name:
          - pdfannots
          - jupyter_client
          - ipykernel
          - ruff
        executable: pip3
    - name: Ensure ~/.bashrc.d exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.bashrc.d"
        state: directory
        mode: "0700"

    - name: Source ~/.bashrc.d/*.sh in .bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        create: yes
        marker: "# {mark} BASHRC.D INCLUDE"
        block: |
          # Source all readable *.sh files from ~/.bashrc.d
          if [ -d "$HOME/.bashrc.d" ]; then
            for f in "$HOME/.bashrc.d"/*.sh; do
              [ -e "$f" ] || continue   # handles "no matches" without nullglob
              [ -r "$f" ] && [ -f "$f" ] && . "$f"
            done
          fi

    - name: Add shell shortcut functions to bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED - shell shortcut functions"
        block: |
          o() { "$@" &>/dev/null & disown; exit; }   # launch GUI, detach, close shell
          b() { "$@" &>/dev/null & disown; }         # launch, detach, keep shell open
          s() { sudo "$@"; }                         # sudo prefix
          complete -c o b s
          e() { emacsclient -n --socket-name "$HOME/.emacs.d/server/server" "$@"; }  # open in running Emacs
          x() {                                      # extract common archive types
            local f
            for f in "$@"; do
              [ -f "$f" ] || { echo "x: not a file: $f" >&2; continue; }
              case "$f" in
                *.tar.bz2|*.tbz2) tar xjf "$f" ;;
                *.tar.gz|*.tgz)   tar xzf "$f" ;;
                *.tar.xz|*.txz)   tar xJf "$f" ;;
                *.tar.zst)        tar --zstd -xf "$f" ;;
                *.tar)            tar xf "$f" ;;
                *.bz2)            bunzip2 "$f" ;;
                *.gz)             gunzip "$f" ;;
                *.xz)             unxz "$f" ;;
                *.zst)            unzstd "$f" ;;
                *.zip)            unzip "$f" ;;
                *.7z)             7z x "$f" ;;
                *.rar)            unrar x "$f" ;;
                *.Z)              uncompress "$f" ;;
                *) echo "x: unknown type: $f" >&2 ;;
              esac
            done
          }
    - name: Auto-start tmux for interactive terminal sessions
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.bashrc.d/tmux-autostart.sh"
        mode: '0644'
        content: |
          # Auto-start tmux for interactive terminal sessions
          if command -v tmux &>/dev/null \
              && [[ $- == *i* ]] \
              && [[ -z "$TMUX" ]] \
              && [[ -z "$INSIDE_EMACS" ]] \
              && [[ -z "$EMACS" ]]; then
              tmux new-session && exit
              # tmux failed (e.g. client/server version mismatch): stay in plain bash
          fi
    - name: Pin yazi/zoxide/kitty versions
      ansible.builtin.set_fact:
        yazi_version: "26.5.6"
        zoxide_version: "0.9.9"
        kitty_version: "0.47.4"
        resvg_version: "0.47.0"

    - name: Ensure ~/.local + extract dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_env.HOME }}/.local/bin"
        - "{{ ansible_env.HOME }}/.local/kitty.app"
        - "{{ ansible_env.HOME }}/.config/yazi"
        - "/tmp/yazi-{{ yazi_version }}"
        - "/tmp/zoxide-{{ zoxide_version }}"
        - "/tmp/resvg-{{ resvg_version }}"

    # Ubuntu's fd-find ships the binary as 'fdfind' (/usr/bin/fd is the
    # unrelated fdclone). ~/.local/bin precedes /usr/bin on PATH.
    - name: Symlink fd -> fdfind for yazi
      ansible.builtin.file:
        src: /usr/bin/fdfind
        dest: "{{ ansible_env.HOME }}/.local/bin/fd"
        state: link
        force: true

    # yazi musl zip extracts to yazi-x86_64-unknown-linux-musl/{yazi,ya}
    - name: Download yazi {{ yazi_version }}
      ansible.builtin.get_url:
        url: "https://github.com/sxyazi/yazi/releases/download/v{{ yazi_version }}/yazi-x86_64-unknown-linux-musl.zip"
        dest: "/tmp/yazi-{{ yazi_version }}.zip"
        mode: "0644"

    - name: Extract yazi {{ yazi_version }}
      ansible.builtin.unarchive:
        src: "/tmp/yazi-{{ yazi_version }}.zip"
        dest: "/tmp/yazi-{{ yazi_version }}"
        remote_src: true
        creates: "/tmp/yazi-{{ yazi_version }}/yazi-x86_64-unknown-linux-musl/yazi"

    - name: Install yazi + ya binaries
      ansible.builtin.copy:
        src: "/tmp/yazi-{{ yazi_version }}/yazi-x86_64-unknown-linux-musl/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop:
        - yazi
        - ya

    # zoxide tarball has the binary at the archive root
    - name: Download zoxide {{ zoxide_version }}
      ansible.builtin.get_url:
        url: "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/zoxide-{{ zoxide_version }}.tar.gz"
        mode: "0644"

    - name: Extract zoxide {{ zoxide_version }}
      ansible.builtin.unarchive:
        src: "/tmp/zoxide-{{ zoxide_version }}.tar.gz"
        dest: "/tmp/zoxide-{{ zoxide_version }}"
        remote_src: true
        creates: "/tmp/zoxide-{{ zoxide_version }}/zoxide"

    - name: Install zoxide binary
      ansible.builtin.copy:
        src: "/tmp/zoxide-{{ zoxide_version }}/zoxide"
        dest: "{{ ansible_env.HOME }}/.local/bin/zoxide"
        remote_src: true
        mode: "0755"

    # resvg renders SVG previews for yazi. Ubuntu's apt resvg is 0.8.0 (2019)
    # and ships the binary as 'rendersvg'; yazi invokes 'resvg'. The upstream
    # prebuilt tarball has a current 'resvg' binary at the archive root.
    - name: Download resvg {{ resvg_version }}
      ansible.builtin.get_url:
        url: "https://github.com/linebender/resvg/releases/download/v{{ resvg_version }}/resvg-linux-x86_64.tar.gz"
        dest: "/tmp/resvg-{{ resvg_version }}.tar.gz"
        mode: "0644"

    - name: Extract resvg {{ resvg_version }}
      ansible.builtin.unarchive:
        src: "/tmp/resvg-{{ resvg_version }}.tar.gz"
        dest: "/tmp/resvg-{{ resvg_version }}"
        remote_src: true
        creates: "/tmp/resvg-{{ resvg_version }}/resvg"

    - name: Install resvg binary
      ansible.builtin.copy:
        src: "/tmp/resvg-{{ resvg_version }}/resvg"
        dest: "{{ ansible_env.HOME }}/.local/bin/resvg"
        remote_src: true
        mode: "0755"

    # kitty txz extracts to the kitty.app tree (bin/ lib/ share/); version is
    # not in any path, so gate install on a version-string check.
    - name: Check installed kitty version
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/kitty --version"
      register: kitty_installed
      changed_when: false
      failed_when: false

    - name: Download kitty {{ kitty_version }}
      ansible.builtin.get_url:
        url: "https://github.com/kovidgoyal/kitty/releases/download/v{{ kitty_version }}/kitty-{{ kitty_version }}-x86_64.txz"
        dest: "/tmp/kitty-{{ kitty_version }}.txz"
        mode: "0644"
      when: kitty_version not in kitty_installed.stdout

    - name: Install kitty into ~/.local/kitty.app
      ansible.builtin.unarchive:
        src: "/tmp/kitty-{{ kitty_version }}.txz"
        dest: "{{ ansible_env.HOME }}/.local/kitty.app"
        remote_src: true
      when: kitty_version not in kitty_installed.stdout

    - name: Symlink kitty + kitten into ~/.local/bin
      ansible.builtin.file:
        src: "{{ ansible_env.HOME }}/.local/kitty.app/bin/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kitty
        - kitten

    - name: Deploy yazi config
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/yazi/yazi.toml"
        mode: "0644"
        content: |
          # Yazi configuration (managed; source of truth is basecamp.org).
          # Companion tools resolved from PATH: fd (->fdfind), rg, fzf, poppler,
          # 7z, imagemagick, ffmpegthumbnailer, zoxide.

          [mgr]
          ratio          = [1, 3, 4]   # parent : current : preview column widths
          show_hidden    = false       # hide dotfiles on launch (toggle live with  .  )
          sort_by        = "natural"   # natural order: file2 before file10
          sort_dir_first = true        # directories above files
          linemode       = "size"      # show file-size column (cycle with  m  )

          [preview]
          tab_size   = 2
          max_width  = 1000
          max_height = 1000

          # Override only the `edit` opener (text files route here). The preset
          # default `${EDITOR:-vi} %s` runs emacsclient with no frame, which fails
          # (exit 1) under a daemon that has no current frame to reuse. `-c` opens a
          # NEW frame; `-n` returns immediately; orphan detaches it from yazi.
          [opener]
          edit = [
            { run = 'emacsclient --socket-name ~/.emacs.d/server/server -c -n %s', orphan = true, desc = "Emacs (new frame)" },
          ]
          inkscape = [
            { run = 'inkscape "%s"', orphan = true, desc = "Edit in Inkscape" },
          ]
          brave = [
            { run = 'brave-browser --new-tab "%s"', orphan = true, desc = "Open in Brave" },
          ]

          # Extend (not replace) the preset open-rule map. `open` is the
          # default-opener alias, kept in each list so the normal default app
          # stays as the other interactive-open (O) choice.
          #
          # Scope note: yazi's interactive picker (O) reads ONLY these rules;
          # it ignores XDG. The single default app per type (fired by o/Enter,
          # via the `open` alias which calls xdg-open) lives in XDG, not here.
          # Set that default once with `xdg-mime default <app.desktop> <mime>`.
          # So put per-type DEFAULTS in XDG (shared by every app), and reserve
          # the entries below only for the extra alternates you want offered in
          # yazi's O menu.
          [open]
          prepend_rules = [
            { mime = "application/pdf", use = [ "inkscape", "open" ] },
            { mime = "text/html", use = [ "brave", "open" ] },
          ]

    - name: Deploy yazi theme
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/yazi/theme.toml"
        mode: "0644"
        content: |
          # Yazi theme (managed; source of truth is basecamp.org).
          # Overrides the default [filetype] rules solely to brighten directory blue.
          # NOTE: this array REPLACES yazi's built-in rules entirely, so keep all rows.
          [filetype]
          rules = [
            { mime = "image/*", fg = "yellow" },
            { mime = "{audio,video}/*", fg = "magenta" },
            { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
            { mime = "application/{pdf,doc,rtf}", fg = "cyan" },
            { mime = "vfs/{absent,stale}", fg = "gray" },
            { url = "*", is = "orphan", bg = "red" },
            { url = "*", is = "exec", fg = "green" },
            { url = "*", is = "dummy", bg = "red" },
            { url = "*/", is = "dummy", bg = "red" },
            { url = "*/", fg = "#5f87ff" },  # directories: bright blue, was dark ANSI "blue"
          ]

    - name: Deploy zoxide shell init
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.bashrc.d/zoxide.sh"
        mode: "0644"
        content: |
          # zoxide — smarter `cd` (frecency jump). Adds `z`/`zi`; also backs yazi's
          # `Z` jump, which queries the same database. (Managed; source: basecamp.org.)
          if command -v zoxide >/dev/null 2>&1; then
              eval "$(zoxide init bash)"
          fi

    - name: Deploy yz launcher (yazi in a kitty window)
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.bashrc.d/yazi.sh"
        mode: "0644"
        content: |
          # yz / yazi — open yazi in a kitty window (sharp previews), then close this terminal.
          #
          # kitty --detach spawns an independent window (survives this shell exiting).
          # Then close the *launching* terminal window:
          #   - inside tmux: `tmux detach-client` exits the tmux client that owns this
          #     gnome-terminal window, so the window closes (exit-action=close) while the
          #     tmux session keeps running, detached. Plain `exit` would only close the
          #     pane, leaving the multi-window session — and the window — alive.
          #   - not in tmux: `exit` ends the shell; gnome-terminal closes the window.
          # The `|| return` guard keeps the terminal open if kitty failed (errors visible).
          #
          # `yazi` is shadowed by this function so the bare name also gets sharp previews;
          # no recursion because kitty execs the binary directly, not via this shell. The
          # inner call is pinned to the absolute path to make that explicit. To run yazi
          # in-pane without the kitty pop-out, use `command yazi` or the full binary path.
          yazi() {
              kitty --detach "$HOME/.local/bin/yazi" "${@:-$PWD}" || return
              if [ -n "$TMUX" ]; then
                  tmux detach-client
              else
                  exit
              fi
          }
          alias yz=yazi

    - name: Verify yazi runs (musl binary, GLIBC-independent)
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/yazi --version"
      register: yazi_check
      changed_when: false
      failed_when: "'Yazi' not in yazi_check.stdout"

    - name: Verify zoxide runs
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/zoxide --version"
      register: zoxide_check
      changed_when: false
      failed_when: "'zoxide' not in zoxide_check.stdout"

    # resvg --version prints only the bare version (no program name), so
    # assert on the pinned version string rather than a name substring.
    - name: Verify resvg runs
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/resvg --version"
      register: resvg_check
      changed_when: false
      failed_when: "resvg_version not in resvg_check.stdout"

    - name: Verify kitty runs
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/kitty --version"
      register: kitty_check
      changed_when: false
      failed_when: "'kitty' not in kitty_check.stdout"
    - name: Set global core.excludesFile for gitignore template
      community.general.git_config:
        name: core.excludesFile
        value: "{{ ansible_env.HOME }}/repos/basecamp/resources/git/jeszyman_gitignore"
        scope: global

    - name: Set global core.hooksPath for shared git hooks
      community.general.git_config:
        name: core.hooksPath
        value: "{{ ansible_env.HOME }}/repos/basecamp/tools/git"
        scope: global
    - name: Find conda installation
      ansible.builtin.shell: |
        for p in /opt/conda /opt/miniconda /opt/miniconda3 {{ ansible_env.HOME }}/miniconda3; do
          if [ -x "$p/bin/conda" ]; then echo "$p"; exit 0; fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: conda_prefix_public
      ignore_errors: yes

    - name: Ensure conda uses strict channel priority
      ansible.builtin.shell: |
        source {{ conda_prefix_public.stdout }}/etc/profile.d/conda.sh && conda config --set channel_priority strict
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ conda_prefix_public.stdout }}/bin:{{ ansible_env.PATH }}"
      when: conda_prefix_public.rc == 0
